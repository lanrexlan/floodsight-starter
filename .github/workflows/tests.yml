name: Tests

# Runs the test suite on every push and pull request.
#
# Until this workflow existed the repository had 112 passing tests that
# nothing ever executed — no CI job referenced pytest. Three production
# defects shipped as a direct result:
#   * health_alerts.yml used AT secret names the sender never reads
#   * scripts/send_health_alerts.py compared an int cell-count against
#     the strings "Watch"/"Warning", so CHEW alerts never dispatched
#   * POST /subscribe saved the subscriber and sent no SMS at all
# Each is the kind of regression a green suite catches in seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: floodsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/floodsight_test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0' wheel
          pip install -r requirements-deploy.txt
          pip install rasterio==1.3.10 pytest httpx pip-audit 'psycopg[binary]'

      - name: Run test suite
        # No secrets are provided: the suite must stay hermetic. If a test
        # starts requiring live Supabase or Africa's Talking credentials it
        # will fail here, which is the intended signal — unit tests should
        # mock those boundaries rather than reach the network.
        run: pytest tests/ -q --maxfail=5

      - name: Set up Node for hermetic UI regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify UI interactions without real providers
        run: node --test tests/ui_regression.cjs

      - name: Dependency vulnerability check
        run: pip-audit

      - name: Verify production container builds
        run: docker build -t floodsight-test .

      - name: Verify container serves packaged assets with depth disabled
        run: |
          docker run -d --name floodsight-smoke -p 8000:8000 \
            -e ENABLE_EXPERIMENTAL_DEPTH=false floodsight-test
          trap 'docker logs floodsight-smoke; docker rm -f floodsight-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/product-status \
            | python -c "import json,sys; assert json.load(sys.stdin)['experimental_depth_enabled'] is False"
          curl --fail --silent 'http://localhost:8000/risk/point?lat=6.52&lon=3.37' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['cell_id'] and d['risk_class']"

      - name: Verify first-party packages are importable
        # Guards the conftest.py sys.path bootstrap. This is the exact
        # failure mode that disabled the CHEW health alerts in production,
        # so it is asserted explicitly rather than left implicit.
        run: |
          python -c "import floodsight, api; print('floodsight + api import OK')"
          python -c "import floodsight.health.chew_alerts; print('chew_alerts import OK')"
          python -c "import floodsight.notifications.africastalking; print('AT sender import OK')"
