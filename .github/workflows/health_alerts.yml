name: FloodSight Health Alerts

on:
  schedule:
    # Primary run — 07:30 WAT = 06:30 UTC
    # After the resident briefing schedules; channel acceptance is independent.
    - cron: "30 6 * * *"
    # Backup run — 07:45 WAT = 06:45 UTC
    # Also scheduled when primary succeeds; delivery reservations prevent duplicates.
    # Idempotency keys in Supabase prevent double-sending.
    - cron: "45 6 * * *"

  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI for testing
    inputs:
      dry_run:
        description: "Dry run (score but do not send SMS or write to DB)"
        required: false
        default: 'true'
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: floodsight-health-alerts
  cancel-in-progress: false

jobs:
  send-health-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout for approval gate
        uses: actions/checkout@v4

      - name: Check channel approval
        id: gate
        env:
          CHANNEL_ENABLED: ${{ secrets.HEALTH_DISPATCH_ENABLED }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 scripts/workflow_gate.py

      - name: Set up Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-scripts.txt

      - name: Run health alert dispatch
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          AT_USERNAME:    ${{ secrets.AT_USERNAME }}
          AT_API_KEY:     ${{ secrets.AT_API_KEY }}
          AT_SENDER_ID:   ${{ secrets.AT_SENDER_ID }}
          FLOODSIGHT_API: ${{ secrets.FLOODSIGHT_API }}
          FLOODSIGHT_ENV: production
          HEALTH_DISPATCH_ENABLED: ${{ secrets.HEALTH_DISPATCH_ENABLED }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/send_health_alerts.py $DRY_RUN_FLAG
